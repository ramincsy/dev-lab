name: Contrib daily (Track B)

on:
  schedule:
    # Cumulative Tehran-day floor: 300, then 600, then 900, then the same 900
    # again. Not 900×4. Slots are early enough that a 5–6h GitHub delay still
    # belongs to that Tehran day (midnight is 20:30 UTC). The script dates
    # commits at the slot, so a catch-up that slips past midnight still counts
    # on the intended day.
    # 01:37 UTC ≈ 05:07 Asia/Tehran, 06:37 ≈ 10:07, 11:37 ≈ 15:07, 14:37 ≈ 18:07.
    - cron: "37 1 * * *"
    - cron: "37 6 * * *"
    - cron: "37 11 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Cumulative target commits for today (Tehran day)"
        required: false
        default: "900"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: contrib-daily
  cancel-in-progress: false

jobs:
  contrib:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Track B (contrib floor)
        env:
          GH_TOKEN: ${{ secrets.DEVLAB_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          BATCH_SIZE: "250"
          GIT_AUTHOR_NAME: ramincsy
          GIT_AUTHOR_EMAIL: 34828058+ramincsy@users.noreply.github.com
          GIT_COMMITTER_NAME: ramincsy
          GIT_COMMITTER_EMAIL: 34828058+ramincsy@users.noreply.github.com
        run: bash scripts/contrib-daily.sh

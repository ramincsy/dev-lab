name: Contrib daily (Track B)

on:
  schedule:
    # Cumulative Tehran-day floor, split so a missed window does not drop the
    # whole day. Totals stay 900 (300, then 600, then 900) — not 900×3.
    # 05:37 UTC ≈ 09:07 Asia/Tehran, 11:37 ≈ 15:07, 17:37 ≈ 21:07.
    - cron: "37 5 * * *"
    - cron: "37 11 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Cumulative target commits for today (Tehran day)"
        required: false
        default: "900"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: contrib-daily
  cancel-in-progress: false

jobs:
  contrib:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Track B (contrib floor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          BATCH_SIZE: "250"
          GIT_AUTHOR_NAME: ramincsy
          GIT_AUTHOR_EMAIL: 34828058+ramincsy@users.noreply.github.com
          GIT_COMMITTER_NAME: ramincsy
          GIT_COMMITTER_EMAIL: 34828058+ramincsy@users.noreply.github.com
        run: bash scripts/contrib-daily.sh

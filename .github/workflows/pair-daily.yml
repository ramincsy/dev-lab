name: Pair daily (Track A)

on:
  schedule:
    # Idempotent: later windows skip slots already on main. A missed 05:07
    # run is retried at 11:07 and 17:07 UTC without creating extra PRs.
    - cron: "7 5 * * *"
    - cron: "7 11 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pair-daily
  cancel-in-progress: false

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Track A (10 pair PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ramincsy
          GIT_AUTHOR_EMAIL: 34828058+ramincsy@users.noreply.github.com
          GIT_COMMITTER_NAME: ramincsy
          GIT_COMMITTER_EMAIL: 34828058+ramincsy@users.noreply.github.com
        run: bash scripts/pair-daily.sh

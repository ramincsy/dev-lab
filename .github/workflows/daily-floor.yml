name: Daily floor

on:
  schedule:
    # 15:31 UTC ≈ 19:01 Asia/Tehran, after the 14:37 catch-up and before Tehran
    # midnight (20:30 UTC), so an on-time run can still top up that day.
    # A start after midnight audits the previous day and does not dispatch.
    - cron: "31 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Tehran-day commit floor
        env:
          GH_TOKEN: ${{ secrets.DEVLAB_PAT || secrets.GITHUB_TOKEN }}
          AUTHOR_EMAIL: 34828058+ramincsy@users.noreply.github.com
          # Half of the 900 Track B floor. A single missed slice (~300) still
          # passes; a dropped morning+midday does not.
          MIN_OK: "450"
        run: bash scripts/daily-floor-check.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token. Track A/B open those PRs with DEVLAB_PAT, so CI is allowed
# to run on the docs-only diffs. A path filter here would skip that CI.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
